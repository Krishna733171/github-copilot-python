<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app">
    <h1>Sudoku Game</h1>

    <div id="sudoku-board"></div>

    <div class="controls">
      <button id="easy-btn" type="button" class="secondary">Easy</button>
      <button id="medium-btn" type="button" class="secondary">Medium</button>
      <button id="hard-btn" type="button" class="secondary">Hard</button>

      <button id="new-game" type="button">New Game</button>
      <button id="check-solution" type="button">Check Solution</button>
      <button id="theme-toggle" type="button" class="secondary">Dark Mode</button>
      <button id="hint-btn" type="button">Hint</button>

      <span id="timer">00:00</span>
      <span id="message"></span>
    </div>
  </div>

  <div class="scoreboard">
    <h2>Top 10 Scores</h2>

    <div class="scoreboard-controls">
      <label for="player-name">Player</label>
      <input id="player-name" type="text" maxlength="20" value="Player 1" />
    </div>

    <ul id="scoreboard-list" class="scoreboard-list"></ul>
  </div>

  <script src="/static/main.js"></script>
</body>
</html>
